<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Althamir | Perfumería Árabe Auténtica en Guatemala</title>
<meta name="description" content="Althamir — Decants y perfumes árabes auténticos en Guatemala. Lattafa, Al Haramain, Armaf, Rayhaan y más. Envíos a todo el país. Ordena por WhatsApp."/>
<link rel="canonical" href="https://althamir.netlify.app"/>

<meta property="og:title" content="Althamir | Perfumería Árabe Auténtica en Guatemala"/>
<meta property="og:description" content="Decants y perfumes árabes auténticos. Desde Q35. Envíos a toda Guatemala."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://althamir.netlify.app"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #c5a059;
    --gold-dark: #a6854a;
    --emerald: #022b21;
    --emerald-light: #044d3b;
    --bg: #011612;
    --text: #e0e0e0;
    --white: #ffffff;
    --card-bg: #022b21;
  }

  body.light-mode {
    --bg: #f4f7f6;
    --text: #1a1a1a;
    --card-bg: #ffffff;
    --emerald: #044d3b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }

  /* Header & Nav */
  header {
    background: linear-gradient(to bottom, rgba(1,22,18,0.9), rgba(1,22,18,0.7));
    padding: 1rem 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(197,160,89,0.2);
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 2px;
    font-weight: 700;
  }

  .nav-tools { display: flex; gap: 15px; align-items: center; }

  .theme-btn, .cart-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 8px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
  }

  .theme-btn:hover, .cart-btn:hover {
    background: var(--gold);
    color: var(--emerald);
  }

  /* Hero */
  .hero {
    height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=1974&auto=format&fit=crop') center/cover;
    padding: 0 20px;
  }

  .hero h1 {
    font-family: 'Cinzel', serif;
    font-size: 3rem;
    color: var(--gold);
    margin-bottom: 10px;
  }

  /* Search Bar */
  .search-container {
    width: 90%;
    max-width: 600px;
    margin: -30px auto 40px;
    position: relative;
    z-index: 10;
  }

  .search-input {
    width: 100%;
    padding: 15px 25px;
    border-radius: 30px;
    border: 2px solid var(--gold);
    background: var(--card-bg);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  /* Grid */
  .container { width: 90%; max-width: 1200px; margin: 0 auto 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
  }

  /* Cards Corregidas */
  .product-card {
    background: var(--card-bg);
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    transition: transform 0.3s, box-shadow 0.3s;
    border: 1px solid rgba(197,160,89,0.1);
    display: flex;
    flex-direction: column;
  }

  .product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }

  .card-img {
    width: 100%;
    height: 250px;
    object-fit: cover;
  }

  .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
  .card-brand { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
  .card-name { font-size: 1.2rem; margin: 5px 0 10px; font-family: 'Cinzel', serif; }
  .card-price { font-weight: 600; color: var(--gold); font-size: 1.1rem; margin-top: auto; }

  /* Badges de Disponibilidad */
  .card-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    color: white;
    z-index: 5;
  }

  .badge-disponible { background: linear-gradient(135deg, #27ae60, #1e8449); }
  .badge-pedido { background: linear-gradient(135deg, #f39c12, #d35400); }

  .btn-add {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: var(--emerald);
    border: none;
    border-radius: 8px;
    margin-top: 15px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-add:hover { background: var(--white); }

  /* Chat Noor */
  #noor-chat {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 350px;
    max-height: 500px;
    background: var(--card-bg);
    border: 1px solid var(--gold);
    border-radius: 15px;
    display: none;
    flex-direction: column;
    z-index: 2000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .chat-header {
    background: var(--gold);
    color: var(--emerald);
    padding: 15px;
    border-radius: 14px 14px 0 0;
    display: flex;
    justify-content: space-between;
    font-family: 'Cinzel', serif;
    font-weight: 700;
  }

  #chat-messages {
    flex-grow: 1;
    overflow-y: auto;
    padding: 15px;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .msg.user { background: var(--gold); color: var(--emerald); align-self: flex-end; }
  .msg.bot { background: rgba(197,160,89,0.1); border: 1px solid var(--gold); align-self: flex-start; }

  .chat-input-area { padding: 15px; display: flex; gap: 10px; }
  #chat-input {
    flex-grow: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--gold);
    color: var(--text);
    padding: 8px;
    border-radius: 5px;
    outline: none;
  }

  #noor-trigger {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--gold);
    color: var(--emerald);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 1999;
  }

  @media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
    #noor-chat { width: 90%; right: 5%; left: 5%; }
  }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">ALTHAMIR</a>
  <div class="nav-tools">
    <button class="theme-btn" id="themeToggle" title="Cambiar modo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</header>

<section class="hero">
  <h1>Fragancias Árabes</h1>
  <p>El lujo del desierto en Guatemala</p>
</section>

<div class="search-container">
  <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o marca (ej. Lattafa)...">
</div>

<div class="container">
  <div class="grid" id="productGrid">
    </div>
</div>

<div id="noor-trigger">✨</div>
<div id="noor-chat">
  <div class="chat-header">
    <span>Noor | Althamir</span>
    <button id="closeChat" style="background:none;border:none;cursor:pointer;color:var(--emerald);font-weight:bold;">✕</button>
  </div>
  <div id="chat-messages">
    <div class="msg bot">¡Hola! Soy Noor. ¿En qué puedo ayudarte hoy? ✨</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Pregunta sobre un perfume...">
    <button id="sendChat" style="background:var(--gold);border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">➤</button>
  </div>
</div>

<script>
  // 1. CONFIGURACIÓN MODO OSCURO / CLARO
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });

  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
  }

  // 2. CARGAR PRODUCTOS DESDE GOOGLE SHEETS
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Xl200tE_Y9L6U6_2Kj-YvG01Ounm-V78uT2D3Y8A9Wk/export?format=csv&gid=0';

  async function cargarProductos() {
    const grid = document.getElementById('productGrid');
    try {
      const response = await fetch(SHEET_URL);
      const data = await response.text();
      const rows = data.split('\n').slice(1);
      
      grid.innerHTML = ''; // Limpiar mensaje de carga

      rows.forEach(row => {
        const columns = row.split(',');
        if (columns.length < 5) return;

        // Mapeo de columnas: Marca, Nombre, Aroma, Tamaño, Precio, Link, Stock
        const [marca, nombre, aroma, tamano, precio, link, stock] = columns;
        
        const isDisponible = stock.trim().toLowerCase() !== 'no';
        const badgeClass = isDisponible ? 'badge-disponible' : 'badge-pedido';
        const badgeText = isDisponible ? 'Disponible' : 'Bajo Pedido';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('data-stock', isDisponible ? 'si' : 'no');
        
        card.innerHTML = `
          <div class="card-badge ${badgeClass}">${badgeText}</div>
          <img src="${link.trim() || 'https://via.placeholder.com/300'}" class="card-img" alt="${nombre}">
          <div class="card-content">
            <span class="card-brand">${marca}</span>
            <h3 class="card-name">${nombre}</h3>
            <p style="font-size:0.8rem; opacity:0.8; margin-bottom:10px;">${aroma}</p>
            <p class="card-price">Q${precio} (${tamano})</p>
            <button class="btn-add" onclick="window.open('https://wa.me/502XXXXXXXX?text=Hola, me interesa el perfume ${nombre}', '_blank')">Ordenar vía WhatsApp</button>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (error) {
      grid.innerHTML = '<p>Error al cargar el catálogo. Por favor intenta más tarde.</p>';
      console.error(error);
    }
  }

  // 3. BUSCADOR DINÁMICO
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.product-card');
    
    cards.forEach(card => {
      const text = card.innerText.toLowerCase();
      card.style.display = text.includes(term) ? 'flex' : 'none';
    });
  });

  // 4. CHAT NOOR (INTEGRACIÓN NETLIFY FUNCTION)
  const trigger = document.getElementById('noor-trigger');
  const chatBox = document.getElementById('noor-chat');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('sendChat');
  const messagesDiv = document.getElementById('chat-messages');

  trigger.onclick = () => { chatBox.style.display = 'flex'; trigger.style.display = 'none'; };
  document.getElementById('closeChat').onclick = () => { chatBox.style.display = 'none'; trigger.style.display = 'flex'; };

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    // Agregar mensaje usuario
    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.textContent = text;
    messagesDiv.appendChild(userMsg);
    chatInput.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const res = await fetch('/.netlify/functions/noor', {
        method: 'POST',
        body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
      });
      const data = await res.json();
      
      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = data.choices[0].message.content;
      messagesDiv.appendChild(botMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } catch (e) {
      console.error(e);
    }
  }

  sendBtn.onclick = sendMessage;
  chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

  // Inicializar
  cargarProductos();
</script>

</body>
</html>
